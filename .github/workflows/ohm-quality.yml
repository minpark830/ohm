name: Ohm public release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read this public commit
        env:
          OHM_COMMIT: ${{ github.sha }}
        run: |
          [[ "$OHM_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git init browser
          git -C browser remote add origin https://github.com/minpark830/ohm.git
          git -C browser fetch --depth=1 origin "$OHM_COMMIT"
          git -C browser checkout --detach FETCH_HEAD
      - name: Check browser syntax and release boundaries
        working-directory: browser
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,readdirSync,lstatSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const allowed=["library-pagination.js","workspace-fields.js","engineering-tools.js","engineering-tools.css","command-menu.js","experience.css","library-discovery.js","library-discovery.css","collections.js","collections-model.js","collections.css","activity.js","activity-model.js","activity.css","diagram-primitives.js","expansion-v4-diagrams.js","expansion-v5-diagrams.js","expansion-v5-circuits-diagrams.js","expansion-v5-transistors-diagrams.js","expansion-v5-digital-diagrams.js","expansion-v6-diagrams.js","expansion-v6-circuits-diagrams.js","expansion-v6-transistors-diagrams.js","expansion-v6-digital-diagrams.js","expansion-v4-circuits-diagrams.js","expansion-v4-transistors-diagrams.js","expansion-v4-digital-diagrams.js","dashboard.js","dashboard-model.js","dashboard.css","reference-drawer.js","reference-drawer.css","library-context.js","submission-feedback.js","navigation-a11y.js","polish.css","lab-storage.js","debugging-state.js","design.js","design-model.js","design.css","walkthrough.js","walkthrough.css","role-tracks.js","role-track-data.js","role-tracks.css","debugging.js","debugging-model.js","debugging.css","expanded-problem-diagrams.js","interview-storage.js","learning-data.js","learning.js","learning.css","help.js","hdl-model.js","hdl-worker.js","hdl-workbench.js","hdl.css","supabase-client.js","index.html","startup.js","app.js","hosting.js","auth.js","guest-storage.js","learner.js","account.js","admin.js","feedback.js","diagram-viewer.js","problem-diagrams.js","problem-diagram-assets.js","simulations.js","simulation-models.js","practice.js","practice-model.js","roadmap-data.js","interview.js","interview-model.js","insights.js","style.css","admin.css","account.css","simulations.css","practice.css","interview.css","insights.css","diagnostics.js","diagnostic-model.js","diagnostics.css","editorial.js","editorial-data.js","editorial.css","engineering-cases.js","case-model.js","case-data.js","engineering-cases.css","circuit-builder.js","circuit-document.js","circuit-builder.css","full-hdl.js","full-hdl-catalog.js","full-hdl-extras.js","hdl-vectors.js","code-editor.js","code-editor.css","submission-history.js","submission-history.css","editorial-catalog.js","editorial-guides.js","editorial-deep-notes.js","design-corners.js","full-hdl.css","full-hdl-state.js","execution-client.js","community.js","community.css","challenges.js","challenges.css","README.md",".nojekyll"];
          const actual=readdirSync('.').filter(n=>!['.git','.github'].includes(n)).sort();
          if(JSON.stringify(actual)!==JSON.stringify([...allowed].sort()))throw new Error('Unexpected or missing release file');
          let version;
          for(const file of actual){
            if(!lstatSync(file).isFile())throw new Error('Only ordinary browser files allowed');
            const body=readFileSync(file,'utf8');
            if(/sb_secret_[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY|OHM_EXECUTION_TOKEN|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|__ohm_local_auth/.test(body))throw new Error('Private runtime material');
            if(file.endsWith('.js'))execFileSync('node',['--input-type=module','--check'],{input:body,stdio:['pipe','inherit','inherit']});
            for(const m of body.matchAll(/['"].\/([^'"?#]+\.(?:js|css))\?v=([a-f0-9]{16})['"]/g)){
              if(!allowed.includes(m[1])||version&&version!==m[2])throw new Error('Broken or mixed asset graph');version=m[2];
            }
          }
          const html=readFileSync('index.html','utf8');
          if(!version||!html.includes('Content-Security-Policy')||!html.includes("object-src 'none'"))throw new Error('Security policy or asset version missing');
          console.log('Public release syntax and boundary checks passed');
          JS
